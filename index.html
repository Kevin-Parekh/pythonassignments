"q": "Divide 100 by 0 safely using try/except and print a friendly message.", "hint": "Catch ZeroDivisionError.", "lines": [{"c": "try:", "t": "Try the risky line."}, {"c": "    print(100 / 0)", "t": "Dividing by zero is impossible."}, {"c": "except ZeroDivisionError:", "t": "Catch this exact error."}, {"c": "    print(\"Cannot divide by zero, says Kevin sir\")", "t": "Friendly message instead of a crash."}], "explain": "`try` is like trying a trick with a safety net. If you fall (error), the `except` net catches you and the program continues.", "out": "Cannot divide by zero, says Kevin sir", "no": 130, "id": "py130"}, {"topic": "Errors & Files", "level": "Easy", "q": "Convert `\"abc\"` to int safely. Print `Please enter a number` if it fails.", "hint": "Catch ValueError.", "lines": [{"c": "text = \"abc\"", "t": "Not a number."}, {"c": "try:", "t": "Try converting."}, {"c": "    n = int(text)", "t": "Fails for letters."}, {"c": "    print(\"Number:\", n)", "t": "Skipped."}, {"c": "except ValueError:", "t": "Wrong value type."}, {"c": "    print(\"Please enter a number\")", "t": "Friendly message."}], "explain": "`int(\"abc\")` is like asking someone to count apples in a picture of a dog. It cannot, so we catch the error.", "out": "Please enter a number", "no": 131, "id": "py131"}, {"topic": "Errors & Files", "level": "Medium", "q": "Use try, except, else and finally for `int(\"85\")` and show which blocks run.", "hint": "else runs when no error, finally always runs.", "lines": [{"c": "try:", "t": "Risky code."}, {"c": "    marks = int(\"85\")", "t": "This works."}, {"c": "except ValueError:", "t": "Not used."}, {"c": "    print(\"Invalid\")", "t": "Skipped."}, {"c": "else:", "t": "No error happened."}, {"c": "    print(\"Marks saved:\", marks)", "t": "Runs."}, {"c": "finally:", "t": "Always runs."}, {"c": "    print(\"Check complete\")", "t": "Runs."}], "explain": "try = attempt, except = plan B, else = it worked, finally = always do this at the end (like switching off the lights).", "out": "Marks saved: 85\nCheck complete", "no": 132, "id": "py132"}, {"topic": "Errors & Files", "level": "Medium", "q": "Write a function that raises ValueError if marks are not between 0 and 100. Test with 120.", "hint": "raise ValueError(\"message\")", "lines": [{"c": "def set_marks(m):", "t": "Check marks."}, {"c": "    if not 0 <= m <= 100:", "t": "Outside the range?"}, {"c": "        raise ValueError(\"Marks must be 0 to 100\")", "t": "raise creates our own error."}, {"c": "    return m", "t": "Valid."}, {"c": "try:", "t": "Call safely."}, {"c": "    set_marks(120)", "t": "Invalid value."}, {"c": "except ValueError as e:", "t": "Catch it."}, {"c": "    print(\"Error:\", e)", "t": "Show our message."}], "explain": "`raise` is like a referee blowing the whistle: \"this is not allowed!\" The program stops unless someone catches it.", "out": "Error: Marks must be 0 to 100", "no": 133, "id": "py133"}, {"topic": "Errors & Files", "level": "Medium", "q": "Write 3 student names to `students.txt`, then read and print the file.", "hint": "Use with open(..., \"w\") then with open(..., \"r\").", "lines": [{"c": "with open(\"students.txt\", \"w\") as f:", "t": "Open for writing. Creates the file."}, {"c": "    f.write(\"Riya\\nAman\\nKevin\\n\")", "t": "Write three lines."}, {"c": "with open(\"students.txt\", \"r\") as f:", "t": "Open for reading."}, {"c": "    print(f.read())", "t": "Print the whole file."}], "explain": "A file is a notebook on the hard disk. \"w\" opens it to write (and erases old content), \"r\" opens it to read. `with` closes the notebook automatically.", "out": "Riya\nAman\nKevin", "no": 134, "id": "py134"}, {"topic": "Errors & Files", "level": "Medium", "q": "Append `Neha` to `students.txt` and count the lines in the file.", "hint": "Mode \"a\" adds at the end.", "lines": [{"c": "with open(\"students.txt\", \"w\") as f:", "t": "Create the file first for this demo."}, {"c": "    f.write(\"Riya\\nAman\\nKevin\\n\")", "t": "Three names."}, {"c": "with open(\"students.txt\", \"a\") as f:", "t": "\"a\" = append: keep old lines, add at the end."}, {"c": "    f.write(\"Neha\\n\")", "t": "New line."}, {"c": "with open(\"students.txt\") as f:", "t": "Read mode is the default."}, {"c": "    lines = f.readlines()", "t": "A list of lines."}, {"c": "print(\"Lines:\", len(lines))", "t": "4"}, {"c": "print(\"Last:\", lines[-1].strip())", "t": "strip() removes the \\n."}], "explain": "\"a\" is like writing on the next empty line of a notebook without tearing the old pages. \"w\" would tear all pages and start fresh.", "out": "Lines: 4\nLast: Neha", "no": 135, "id": "py135"}, {"topic": "OOP", "level": "Easy", "q": "Create a class `Student` with name and course. Make an object for Riya (Python) and print her details.", "hint": "Use __init__(self, name, course).", "lines": [{"c": "class Student:", "t": "A blueprint for students."}, {"c": "    def __init__(self, name, course):", "t": "Runs automatically when an object is created."}, {"c": "        self.name = name", "t": "Save name inside the object."}, {"c": "        self.course = course", "t": "Save course."}, {"c": "s = Student(\"Riya\", \"Python\")", "t": "Create an object from the blueprint."}, {"c": "print(s.name, \"-\", s.course)", "t": "Read the details."}], "explain": "A class is a cookie cutter, an object is the cookie. `__init__` decides what each cookie gets when it is made.", "out": "Riya - Python", "no": 136, "id": "py136"}, {"topic": "OOP", "level": "Easy", "q": "Add a method `introduce()` to a `Teacher` class that prints `I am Kevin Parekh, I teach Python`.", "hint": "Methods take self as the first parameter.", "lines": [{"c": "class Teacher:", "t": "Blueprint."}, {"c": "    def __init__(self, name, subject):", "t": "Constructor."}, {"c": "        self.name = name", "t": "Save name."}, {"c": "        self.subject = subject", "t": "Save subject."}, {"c": "    def introduce(self):", "t": "A method: a function that belongs to the object."}, {"c": "        print(f\"I am {self.name}, I teach {self.subject}\")", "t": "Uses the object's own data."}, {"c": "t = Teacher(\"Kevin Parekh\", \"Python\")", "t": "Create a teacher."}, {"c": "t.introduce()", "t": "Call the method."}], "explain": "A method is something an object can DO. `self` means \"me\", so `self.name` is \"my name\".", "out": "I am Kevin Parekh, I teach Python", "no": 137, "id": "py137"}, {"topic": "OOP", "level": "Medium", "q": "Create a `BankAccount` class with deposit and withdraw methods. Start with 1000, deposit 500, withdraw 2000 (refuse), withdraw 300.", "hint": "Check balance before withdrawing.", "lines": [{"c": "class BankAccount:", "t": "Blueprint."}, {"c": "    def __init__(self, owner, balance=0):", "t": "Default balance 0."}, {"c": "        self.owner = owner", "t": "Owner name."}, {"c": "        self.balance = balance", "t": "Money."}, {"c": "    def deposit(self, amount):", "t": "Add money."}, {"c": "        self.balance += amount", "t": "Increase."}, {"c": "        print(\"Deposited\", amount, \"| Balance\", self.balance)", "t": "Show."}, {"c": "    def withdraw(self, amount):", "t": "Take money."}, {"c": "        if amount > self.balance:", "t": "Not enough?"}, {"c": "            print(\"Insufficient balance\")", "t": "Refuse."}, {"c": "        else:", "t": "Enough."}, {"c": "            self.balance -= amount", "t": "Decrease."}, {"c": "            print(\"Withdrew\", amount, \"| Balance\", self.balance)", "t": "Show."}, {"c": "acc = BankAccount(\"Kevin Parekh\", 1000)", "t": "Create the account."}, {"c": "acc.deposit(500)", "t": "1500."}, {"c": "acc.withdraw(2000)", "t": "Refused."}, {"c": "acc.withdraw(300)", "t": "1200."}], "explain": "The object remembers its own balance like a real piggy bank. Each method changes or checks that balance.", "out": "Deposited 500 | Balance 1500\nInsufficient balance\nWithdrew 300 | Balance 1200", "no": 138, "id": "py138"}, {"topic": "OOP", "level": "Medium", "q": "Add a `__str__` method to a `Course` class so `print(course)` shows `Python - Rs 999`.", "hint": "__str__ must return a string.", "lines": [{"c": "class Course:", "t": "Blueprint."}, {"c": "    def __init__(self, title, fees):", "t": "Constructor."}, {"c": "        self.title = title", "t": "Title."}, {"c": "        self.fees = fees", "t": "Fees."}, {"c": "    def __str__(self):", "t": "Called by print()."}, {"c": "        return f\"{self.title} - Rs {self.fees}\"", "t": "What to show."}, {"c": "print(Course(\"Python\", 999))", "t": "Uses __str__."}], "explain": "Without `__str__`, printing an object shows a confusing memory address. `__str__` teaches the object how to introduce itself.", "out": "Python - Rs 999", "no": 139, "id": "py139"}, {"topic": "OOP", "level": "Medium", "q": "Create a `Person` class and a `Student` class that inherits from it and adds a course. Print a student's details.", "hint": "class Student(Person) and super().__init__(...)", "lines": [{"c": "class Person:", "t": "Parent class."}, {"c": "    def __init__(self, name):", "t": "Parent constructor."}, {"c": "        self.name = name", "t": "Every person has a name."}, {"c": "class Student(Person):", "t": "Child class gets everything from Person."}, {"c": "    def __init__(self, name, course):", "t": "Child constructor with an extra value."}, {"c": "        super().__init__(name)", "t": "Let the parent save the name."}, {"c": "        self.course = course", "t": "Child saves the course."}, {"c": "s = Student(\"Aman\", \"AI Tools\")", "t": "Create a student."}, {"c": "print(s.name, \"studies\", s.course)", "t": "name came from Person."}], "explain": "Inheritance is like a child getting the family surname automatically. The child class gets the parent's features and can add its own.", "out": "Aman studies AI Tools", "no": 140, "id": "py140"}, {"topic": "OOP", "level": "Medium", "q": "Show polymorphism: classes `Dog` and `Cat` both have `speak()`. Loop over them and call speak().", "hint": "Same method name, different behaviour.", "lines": [{"c": "class Dog:", "t": "One class."}, {"c": "    def speak(self):", "t": "speak method."}, {"c": "        return \"Woof\"", "t": "Dog sound."}, {"c": "class Cat:", "t": "Another class."}, {"c": "    def speak(self):", "t": "Same method name."}, {"c": "        return \"Meow\"", "t": "Different sound."}, {"c": "for animal in (Dog(), Cat()):", "t": "Two different objects."}, {"c": "    print(type(animal).__name__, \"says\", animal.speak())", "t": "Same call, different result."}], "explain": "Polymorphism means \"many forms\". You say the same word (`speak`) to different animals and each answers in its own way.", "out": "Dog says Woof\nCat says Meow", "no": 141, "id": "py141"}, {"topic": "SQLite", "level": "Easy", "q": "Create an SQLite database `school.db` with a table `students(id, name, marks)`.", "hint": "connect, execute CREATE TABLE, commit, close.", "lines": [{"c": "import sqlite3", "t": "Built-in database module."}, {"c": "conn = sqlite3.connect(\"school.db\")", "t": "Open or create the file."}, {"c": "conn.execute(\"CREATE TABLE IF NOT EXISTS students (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, marks INTEGER)\")", "t": "Create the table only if missing."}, {"c": "conn.commit()", "t": "Save."}, {"c": "conn.close()", "t": "Close."}, {"c": "print(\"Table created\")", "t": "Confirmation."}], "explain": "A database is a super notebook. A table is one page with columns. `CREATE TABLE` draws the columns on that page.", "out": "Table created", "no": 142, "id": "py142"}, {"topic": "SQLite", "level": "Easy", "q": "Insert 3 students into the `students` table and print how many rows were added.", "hint": "Use executemany with ? placeholders.", "lines": [{"c": "import sqlite3", "t": "Module."}, {"c": "conn = sqlite3.connect(\"school.db\")", "t": "Open."}, {"c": "conn.execute(\"CREATE TABLE IF NOT EXISTS students (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, marks INTEGER)\")", "t": "Make sure the table exists."}, {"c": "data = [(\"Riya\", 88), (\"Aman\", 54), (\"Kevin\", 95)]", "t": "Three rows."}, {"c": "cur = conn.executemany(\"INSERT INTO students (name, marks) VALUES (?, ?)\", data)", "t": "Insert all rows. ? are safe placeholders."}, {"c": "conn.commit()", "t": "Save."}, {"c": "print(cur.rowcount, \"rows added\")", "t": "3"}, {"c": "conn.close()", "t": "Close."}], "explain": "`?` is a safe empty slot. Python fills it with real values, so nobody can trick your database with strange text.", "out": "3 rows added", "no": 143, "id": "py143"}, {"topic": "SQLite", "level": "Medium", "q": "Insert 3 students and print all students with marks above 60, highest first.", "hint": "SELECT ... WHERE marks > ? ORDER BY marks DESC", "lines": [{"c": "import sqlite3", "t": "Module."}, {"c": "conn = sqlite3.connect(\":memory:\")", "t": "A temporary database in memory, perfect for practice."}, {"c": "conn.execute(\"CREATE TABLE students (name TEXT, marks INTEGER)\")", "t": "Table."}, {"c": "conn.executemany(\"INSERT INTO students VALUES (?, ?)\", [(\"Riya\", 88), (\"Aman\", 54), (\"Kevin\", 95)])", "t": "Data."}, {"c": "rows = conn.execute(\"SELECT name, marks FROM students WHERE marks > ? ORDER BY marks DESC\", (60,)).fetchall()", "t": "Filter and sort."}, {"c": "for name, marks in rows:", "t": "Each row is a tuple."}, {"c": "    print(name, marks)", "t": "Kevin 95, Riya 88."}], "explain": "`SELECT` asks the database a question. `WHERE` is the filter and `ORDER BY ... DESC` sorts from highest to lowest.", "out": "Kevin 95\nRiya 88", "no": 144, "id": "py144"}, {"topic": "SQLite", "level": "Medium", "q": "Update Aman's marks to 70 and delete Riya. Print the remaining rows.", "hint": "UPDATE ... SET ... WHERE, DELETE FROM ... WHERE", "lines": [{"c": "import sqlite3", "t": "Module."}, {"c": "conn = sqlite3.connect(\":memory:\")", "t": "Practice database."}, {"c": "conn.execute(\"CREATE TABLE students (name TEXT, marks INTEGER)\")", "t": "Table."}, {"c": "conn.executemany(\"INSERT INTO students VALUES (?, ?)\", [(\"Riya\", 88), (\"Aman\", 54), (\"Kevin\", 95)])", "t": "Data."}, {"c": "conn.execute(\"UPDATE students SET marks = ? WHERE name = ?\", (70, \"Aman\"))", "t": "Change one row."}, {"c": "conn.execute(\"DELETE FROM students WHERE name = ?\", (\"Riya\",))", "t": "Remove one row. Note the comma in (\"Riya\",)."}, {"c": "print(conn.execute(\"SELECT * FROM students\").fetchall())", "t": "What is left."}], "explain": "UPDATE is like using an eraser and writing a new number. DELETE is like tearing out one line. Always use WHERE, otherwise every row changes!", "out": "[('Aman', 70), ('Kevin', 95)]", "no": 145, "id": "py145"}, {"topic": "SQLite", "level": "Medium", "q": "Write a `register(username, password)` and `login(username, password)` using SQLite. Register `kevin`, then try a wrong and a right password.", "hint": "UNIQUE username; SELECT with username AND password.", "lines": [{"c": "import sqlite3", "t": "Module."}, {"c": "conn = sqlite3.connect(\":memory:\")", "t": "Practice database."}, {"c": "conn.execute(\"CREATE TABLE users (username TEXT UNIQUE, password TEXT)\")", "t": "UNIQUE: no duplicates."}, {"c": "def register(u, p):", "t": "Add a user."}, {"c": "    try:", "t": "Duplicate usernames cause an error."}, {"c": "        conn.execute(\"INSERT INTO users VALUES (?, ?)\", (u, p))", "t": "Save."}, {"c": "        return \"Registered\"", "t": "Success."}, {"c": "    except sqlite3.IntegrityError:", "t": "Duplicate."}, {"c": "        return \"Username taken\"", "t": "Message."}, {"c": "def login(u, p):", "t": "Check a user."}, {"c": "    row = conn.execute(\"SELECT * FROM users WHERE username = ? AND password = ?\", (u, p)).fetchone()", "t": "None if no match."}, {"c": "    return \"Welcome \" + u if row else \"Wrong login\"", "t": "Result."}, {"c": "print(register(\"kevin\", \"ticl123\"))", "t": "Registered"}, {"c": "print(register(\"kevin\", \"abc\"))", "t": "Username taken"}, {"c": "print(login(\"kevin\", \"wrong\"))", "t": "Wrong login"}, {"c": "print(login(\"kevin\", \"ticl123\"))", "t": "Welcome kevin"}], "explain": "Register writes your name in the guest book. Login checks if your name AND secret word match a line in the book. (In real apps, store a hashed password, as taught in Advance python.)", "out": "Registered\nUsername taken\nWrong login\nWelcome kevin", "no": 146, "id": "py146"}, {"topic": "SQLite", "level": "Medium", "q": "Count the students and find the average marks using SQL functions.", "hint": "SELECT COUNT(*), AVG(marks) FROM students", "lines": [{"c": "import sqlite3", "t": "Module."}, {"c": "conn = sqlite3.connect(\":memory:\")", "t": "Practice database."}, {"c": "conn.execute(\"CREATE TABLE students (name TEXT, marks INTEGER)\")", "t": "Table."}, {"c": "conn.executemany(\"INSERT INTO students VALUES (?, ?)\", [(\"Riya\", 88), (\"Aman\", 54), (\"Kevin\", 95)])", "t": "Data."}, {"c": "count, avg = conn.execute(\"SELECT COUNT(*), AVG(marks) FROM students\").fetchone()", "t": "One row with two answers."}, {"c": "print(\"Students:\", count, \"| Average:\", round(avg, 1))", "t": "3 and 79.0"}], "explain": "The database can do maths for you. `COUNT` counts rows and `AVG` finds the average, so you do not need a loop.", "out": "Students: 3 | Average: 79.0", "no": 147, "id": "py147"}, {"topic": "Tkinter", "level": "Easy", "q": "Make a Tkinter window titled `TICL Academy` with a label `Hello Kevin`.", "hint": "Tk(), title(), Label().pack(), mainloop()", "lines": [{"c": "import tkinter as tk", "t": "GUI library."}, {"c": "root = tk.Tk()", "t": "Main window."}, {"c": "root.title(\"TICL Academy\")", "t": "Window title."}, {"c": "tk.Label(root, text=\"Hello Kevin\", font=(\"Arial\", 18)).pack(padx=40, pady=30)", "t": "A label with some space around it."}, {"c": "root.mainloop()", "t": "Keep the window open."}], "explain": "Tkinter builds windows. `Tk()` is the empty window, `Label` is a sticker with text, `pack` sticks it on, and `mainloop` keeps the window open.", "out": "A window opens showing \"Hello Kevin\". Close it to end the program.", "no": 148, "id": "py148"}, {"topic": "Tkinter", "level": "Medium", "q": "Make a window with a button. Each click should increase a counter shown on a label.", "hint": "command=function and label.config(text=...)", "lines": [{"c": "import tkinter as tk", "t": "GUI library."}, {"c": "count = 0", "t": "Counter."}, {"c": "def click():", "t": "Runs on every click."}, {"c": "    global count", "t": "Change the global counter."}, {"c": "    count += 1", "t": "Add one."}, {"c": "    label.config(text=f\"Clicks: {count}\")", "t": "Update the label text."}, {"c": "root = tk.Tk()", "t": "Window."}, {"c": "label = tk.Label(root, text=\"Clicks: 0\", font=(\"Arial\", 16))", "t": "Label to update."}, {"c": "label.pack(padx=30, pady=10)", "t": "Place it."}, {"c": "tk.Button(root, text=\"Click me\", command=click).pack(pady=10)", "t": "command=click (no brackets)."}, {"c": "root.mainloop()", "t": "Keep open."}], "explain": "The button is a doorbell and `click` is what happens when someone rings it. `config` changes the label text each time.", "out": "A window with \"Clicks: 0\" and a button. Each click adds 1: Clicks: 1, Clicks: 2 ...", "no": 149, "id": "py149"}, {"topic": "Tkinter", "level": "Medium", "q": "Make a window with an Entry and a button. When clicked, show `Welcome, <name>!` below.", "hint": "entry.get() reads the text.", "lines": [{"c": "import tkinter as tk", "t": "GUI library."}, {"c": "def greet():", "t": "Button action."}, {"c": "    msg.config(text=f\"Welcome, {box.get()}!\")", "t": "get() reads what was typed."}, {"c": "root = tk.Tk()", "t": "Window."}, {"c": "box = tk.Entry(root, font=(\"Arial\", 14))", "t": "Text box."}, {"c": "box.pack(padx=20, pady=10)", "t": "Place it."}, {"c": "tk.Button(root, text=\"Greet\", command=greet).pack()", "t": "Button."}, {"c": "msg = tk.Label(root, text=\"\", font=(\"Arial\", 14))", "t": "Empty label for the message."}, {"c": "msg.pack(pady=10)", "t": "Place it."}, {"c": "root.mainloop()", "t": "Keep open."}], "explain": "The Entry is a small notebook. `get()` reads what was written in it, and the label shows the greeting.", "out": "Type \"Kevin Parekh\" and click Greet: the window shows \"Welcome, Kevin Parekh!\"", "no": 150, "id": "py150"}]}, {"id": "html", "label": "HTML / CSS", "kind": "html", "items": [{"q": "What is **HTML**?", "answer": "**HTML** (HyperText Markup Language) is the language that builds the **structure** of a web page. It tells the browser \"this is a heading, this is a paragraph, this is a picture\". Think of HTML as the **skeleton** of a body: it gives shape, but no colour.", "lines": [{"c": "<h1>TICL Academy<\/h1>", "t": "A heading."}, {"c": "<p>Learn Python with Kevin sir.<\/p>", "t": "A paragraph."}], "lang": "html", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><h1>TICL Academy<\/h1><p>Learn Python with Kevin sir.<\/p><\/div>", "previewH": 110, "no": 1, "id": "html1"}, {"q": "What is a **tag**? What are opening and closing tags?", "answer": "A **tag** is a keyword inside angle brackets that marks a part of the page. Most tags come in pairs: an **opening tag** `<p>` and a **closing tag** `<\/p>` with a slash. The content sits between them, like a sandwich. Some tags like `<img>` and `<br>` have no closing tag.", "lines": [{"c": "<p>This is inside the p tag.<\/p>", "t": "<p> opens, <\/p> closes. The text is the filling of the sandwich."}, {"c": "<br>", "t": "A line break. It has no closing tag."}], "lang": "html", "no": 2, "id": "html2"}, {"q": "What is an **attribute**?", "answer": "An **attribute** gives extra information to a tag. It is written inside the opening tag as `name=\"value\"`. Example: in `<a href=\"...\">`, `href` tells WHERE the link goes. Think of attributes as **settings** of a tag.", "lines": [{"c": "<a href=\"https://academy.ticl.in\" target=\"_blank\">TICL Academy<\/a>", "t": "href = link address. target=\"_blank\" opens it in a new tab."}, {"c": "<img src=\"kevin.jpg\" alt=\"Kevin sir\" width=\"120\">", "t": "src = picture file, alt = text if the picture fails, width = size."}], "lang": "html", "no": 3, "id": "html3"}, {"q": "Write the **basic structure** of an HTML page.", "answer": "Every HTML page has the same frame: `<!DOCTYPE html>` on top, then `<html>`, inside it `<head>` (settings, title) and `<body>` (everything visible).", "lines": [{"c": "<!DOCTYPE html>", "t": "Says: this is an HTML5 page."}, {"c": "<html>", "t": "Start of the page."}, {"c": "<head>", "t": "Hidden settings."}, {"c": "  <title>My Page<\/title>", "t": "Text on the browser tab."}, {"c": "<\/head>", "t": "End of head."}, {"c": "<body>", "t": "Visible part starts."}, {"c": "  <h1>Hello Kevin<\/h1>", "t": "Content."}, {"c": "<\/body>", "t": "Visible part ends."}, {"c": "<\/html>", "t": "End of the page."}], "lang": "html", "no": 4, "id": "html4"}, {"q": "What are **heading** and **paragraph** tags?", "answer": "Headings `<h1>` to `<h6>` are titles, `h1` is the biggest and most important, `h6` the smallest. `<p>` is for normal paragraphs of text. Like a newspaper: big headline, smaller sub headings, then paragraphs.", "lines": [{"c": "<h1>Main title<\/h1>", "t": "Biggest heading. Use once per page."}, {"c": "<h3>Sub heading<\/h3>", "t": "Smaller heading."}, {"c": "<p>A normal paragraph of text.<\/p>", "t": "Paragraph."}], "lang": "html", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><h1 style=\"margin:4px 0\">Main title<\/h1><h3 style=\"margin:4px 0\">Sub heading<\/h3><p>A normal paragraph of text.<\/p><\/div>", "previewH": 130, "no": 5, "id": "html5"}, {"q": "What is the **anchor tag** `<a>`?", "answer": "The **anchor tag** creates a **link**. Clicking it takes you to another page, website, section or email. The `href` attribute holds the address.", "lines": [{"c": "<a href=\"about.html\">About us<\/a>", "t": "Link to another page of your site."}, {"c": "<a href=\"https://academy.ticl.in\">TICL website<\/a>", "t": "Link to another website."}, {"c": "<a href=\"mailto:info@ticl.in\">Email us<\/a>", "t": "Opens the email app."}], "lang": "html", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><a href=\"#\">About us<\/a><br><a href=\"#\">TICL website<\/a><br><a href=\"#\">Email us<\/a><\/div>", "previewH": 90, "no": 6, "id": "html6"}, {"q": "What is the `<img>` tag?", "answer": "The `<img>` tag shows a picture. `src` is the image file, `alt` is the text description (shown if the image fails and read by screen readers for blind users). It has no closing tag.", "lines": [{"c": "<img src=\"logo.png\" alt=\"TICL Academy logo\" width=\"100\">", "t": "Shows logo.png at 100 pixels wide."}], "lang": "html", "no": 7, "id": "html7"}, {"q": "What are **lists** in HTML (`ul`, `ol`, `li`)?", "answer": "`<ul>` is an **unordered** list with bullet points. `<ol>` is an **ordered** list with numbers. Each item inside is an `<li>` (list item).", "lines": [{"c": "<ul>", "t": "Bullet list."}, {"c": "  <li>Python<\/li>", "t": "Item."}, {"c": "  <li>AI Tools<\/li>", "t": "Item."}, {"c": "<\/ul>", "t": "End."}, {"c": "<ol>", "t": "Numbered list."}, {"c": "  <li>Register<\/li>", "t": "Step 1."}, {"c": "  <li>Login<\/li>", "t": "Step 2."}, {"c": "<\/ol>", "t": "End."}], "lang": "html", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><ul><li>Python<\/li><li>AI Tools<\/li><\/ul><ol><li>Register<\/li><li>Login<\/li><\/ol><\/div>", "previewH": 150, "no": 8, "id": "html8"}, {"q": "How do you make a **table** in HTML?", "answer": "A table is made with `<table>`. Each row is `<tr>` (table row). Heading cells are `<th>` and normal cells are `<td>` (table data).", "lines": [{"c": "<table border=\"1\">", "t": "border=\"1\" draws simple lines."}, {"c": "  <tr><th>Name<\/th><th>Marks<\/th><\/tr>", "t": "Header row with th cells."}, {"c": "  <tr><td>Riya<\/td><td>88<\/td><\/tr>", "t": "Data row."}, {"c": "  <tr><td>Kevin<\/td><td>95<\/td><\/tr>", "t": "Data row."}, {"c": "<\/table>", "t": "End of table."}], "lang": "html", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><table border=\"1\" cellpadding=\"6\"><tr><th>Name<\/th><th>Marks<\/th><\/tr><tr><td>Riya<\/td><td>88<\/td><\/tr><tr><td>Kevin<\/td><td>95<\/td><\/tr><\/table><\/div>", "previewH": 130, "no": 9, "id": "html9"}, {"q": "What is a **form**? Explain `input`, `name` and `button`.", "answer": "A **form** collects data from the user, like a login page. `<input>` is a box to type in. The `name` attribute is the label Python uses to read the value (`request.form[\"email\"]`). `<button type=\"submit\">` sends the form.", "lines": [{"c": "<form action=\"/login\" method=\"POST\">", "t": "Send the data to /login using POST."}, {"c": "  <input type=\"email\" name=\"email\" placeholder=\"Email\">", "t": "An email box. name=\"email\" is read by Python."}, {"c": "  <input type=\"password\" name=\"password\" placeholder=\"Password\">", "t": "Hidden typing."}, {"c": "  <button type=\"submit\">Login<\/button>", "t": "Sends the form."}, {"c": "<\/form>", "t": "End."}], "lang": "html", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><form onsubmit=\"return false\"><input type=\"email\" placeholder=\"Email\"><br><br><input type=\"password\" placeholder=\"Password\"><br><br><button>Login<\/button><\/form><\/div>", "previewH": 130, "no": 10, "id": "html10"}, {"q": "What is the difference between `<div>` and `<span>`?", "answer": "`<div>` is a **block** box: it takes the full width and starts on a new line. It groups big sections. `<span>` is **inline**: it sits inside a line of text and only takes the space it needs, used to style a few words.", "lines": [{"c": "<div style=\"background:#dbeafe\">A div takes the full line.<\/div>", "t": "Block box."}, {"c": "<p>Kevin sir teaches <span style=\"color:red\">Python<\/span> daily.<\/p>", "t": "span colours just one word inside the sentence."}], "lang": "html", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><div style=\"background:#dbeafe;padding:4px\">A div takes the full line.<\/div><p>Kevin sir teaches <span style=\"color:red\">Python<\/span> daily.<\/p><\/div>", "previewH": 90, "no": 11, "id": "html11"}, {"q": "What is **CSS**?", "answer": "**CSS** (Cascading Style Sheets) is the language that makes a web page look nice: colours, fonts, sizes, spacing and layout. If HTML is the skeleton, CSS is the **clothes and makeup**.", "lines": [{"c": "h1 { color: navy; font-family: Arial; }", "t": "Every h1 becomes navy blue in Arial font."}, {"c": "p { font-size: 18px; }", "t": "Every paragraph text becomes 18 pixels."}], "lang": "css", "no": 12, "id": "html12"}, {"q": "What are CSS **selectors**: element, class and id?", "answer": "A **selector** chooses which elements to style. **Element** selector `p` styles all paragraphs. **Class** selector `.card` (with a dot) styles every tag with `class=\"card\"`, and many tags can share it. **Id** selector `#main` (with a hash) styles the ONE tag with `id=\"main\"`.", "lines": [{"c": "p { color: gray; }", "t": "All p tags."}, {"c": ".card { border: 1px solid #ccc; padding: 10px; }", "t": "Any tag with class=\"card\"."}, {"c": "#main { background: #fef3c7; }", "t": "Only the tag with id=\"main\"."}], "lang": "css", "no": 13, "id": "html13"}, {"q": "What are the **3 ways** to add CSS?", "answer": "1. **Inline**: `style=\"\"` inside a tag (quick, for one element). 2. **Internal**: `<style>` in the head (for one page). 3. **External**: a separate `.css` file linked with `<link>` (best, one file styles the whole website).", "lines": [{"c": "<p style=\"color:red\">Inline CSS<\/p>", "t": "1. Inline: written on the tag itself."}, {"c": "<style> p { color: blue; } <\/style>", "t": "2. Internal: inside the page head."}, {"c": "<link rel=\"stylesheet\" href=\"style.css\">", "t": "3. External: a separate file. Best for projects."}], "lang": "html", "no": 14, "id": "html14"}, {"q": "How do you set **colours and fonts** in CSS?", "answer": "`color` changes the text colour, `background-color` changes the background, `font-family` sets the font, `font-size` the size and `font-weight: bold` makes it bold. Colours can be names (`red`), hex codes (`#2563EB`) or rgb values.", "lines": [{"c": ".title {", "t": "A class rule."}, {"c": "  color: #2563EB;", "t": "Blue text (hex code)."}, {"c": "  background-color: #FEF3C7;", "t": "Light yellow background."}, {"c": "  font-family: Arial, sans-serif;", "t": "Font with a fallback."}, {"c": "  font-size: 24px;", "t": "Size."}, {"c": "  font-weight: bold;", "t": "Bold."}, {"c": "}", "t": "End of rule."}], "lang": "css", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><div style=\"color:#2563EB;background-color:#FEF3C7;font-family:Arial;font-size:24px;font-weight:bold;padding:6px\">TICL Academy<\/div><\/div>", "previewH": 70, "no": 15, "id": "html15"}, {"q": "What is the **CSS box model**?", "answer": "Every element is a box with 4 layers, from inside to outside: **content** (text), **padding** (space inside the border), **border** (the line), and **margin** (space outside, between boxes). Like a photo: the photo, the white mount around it, the frame, and the gap on the wall.", "lines": [{"c": ".box {", "t": "A box."}, {"c": "  padding: 16px;", "t": "Space INSIDE the border."}, {"c": "  border: 3px solid #2563EB;", "t": "The frame line."}, {"c": "  margin: 20px;", "t": "Space OUTSIDE the border."}, {"c": "}", "t": "End."}], "lang": "css", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><div style=\"background:#eee;padding:1px\"><div style=\"padding:16px;border:3px solid #2563EB;margin:20px;background:white\">Content<\/div><\/div><\/div>", "previewH": 130, "no": 16, "id": "html16"}, {"q": "What is the difference between **block** and **inline** display?", "answer": "**Block** elements (`div`, `p`, `h1`) start on a new line and take the full width. **Inline** elements (`span`, `a`, `b`) stay in the same line and take only the space they need. `display: inline-block` stays in line but allows width and padding, often used for buttons.", "lines": [{"c": "a.btn { display: inline-block; padding: 8px 14px; background: #2563EB; color: white; }", "t": "Makes a link look like a button that sits in the line."}], "lang": "css", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><p>Click <a style=\"display:inline-block;padding:8px 14px;background:#2563EB;color:white;text-decoration:none\">Join now<\/a> to start.<\/p><\/div>", "previewH": 70, "no": 17, "id": "html17"}, {"q": "What is **Flexbox**?", "answer": "**Flexbox** (`display: flex`) is a CSS layout that places child boxes in a row (or column) and makes aligning easy. `justify-content` controls horizontal spacing and `align-items` controls vertical alignment. Great for navbars and cards side by side.", "lines": [{"c": ".row {", "t": "The parent container."}, {"c": "  display: flex;", "t": "Children sit in a row."}, {"c": "  gap: 10px;", "t": "Space between children."}, {"c": "  justify-content: center;", "t": "Centre them horizontally."}, {"c": "}", "t": "End."}], "lang": "css", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><div style=\"display:flex;gap:10px;justify-content:center\"><div style=\"background:#dbeafe;padding:14px\">Python<\/div><div style=\"background:#fef3c7;padding:14px\">AI<\/div><div style=\"background:#d1fae5;padding:14px\">Excel<\/div><\/div><\/div>", "previewH": 70, "no": 18, "id": "html18"}, {"q": "What is the `:hover` **pseudo class**?", "answer": "`:hover` applies a style only when the mouse is over an element. It makes buttons and links feel interactive.", "lines": [{"c": ".btn { background: #2563EB; color: white; padding: 10px; }", "t": "Normal look."}, {"c": ".btn:hover { background: #F59E0B; }", "t": "When the mouse is over it, it turns gold."}], "lang": "css", "preview": "<div style=\"font-family:Arial,sans-serif;padding:8px\"><style>.b{background:#2563EB;color:white;padding:10px 16px;border:0;border-radius:6px}.b:hover{background:#F59E0B}<\/style><button class=\"b\">Hover over me<\/button><\/div>", "previewH": 70, "no": 19, "id": "html19"}, {"q": "What is **responsive design** and a **media query**?", "answer": "**Responsive design** means the page looks good on mobile, tablet and laptop. A **media query** `@media (max-width: 600px) {...}` applies CSS only when the screen is small. Also add `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">` in the head.", "lines": [{"c": ".cards { display: flex; }", "t": "On big screens: cards in a row."}, {"c": "@media (max-width: 600px) {", "t": "Only when the screen is 600px or narrower..."}, {"c": "  .cards { flex-direction: column; }", "t": "...stack the cards one below another."}, {"c": "}", "t": "End of media query."}], "lang": "css", "no": 20, "id": "html20"}]}, {"id": "ai", "label": "AI Prompts", "kind": "ai", "items": [{"q": "You do not understand the difference between a **list** and a **tuple**. Ask an AI to explain it simply.", "bad": "list vs tuple", "prompt": "Explain the difference between a list and a tuple in Python to a beginner student.\nUse simple English, one real life example for each,\na short code example for each (5 lines max),\nand a small table comparing them.", "explain": "A good prompt says **who you are** (beginner), **how** you want it (simple English, real life example) and **what format** (code + table). The AI then gives an answer that fits your level.", "tips": ["Tell the AI your level: beginner, college student, etc.", "Ask for examples and a format like a table."], "no": 1, "id": "ai1"}, {"q": "Your program shows an **error**. Ask the AI to fix it.", "bad": "my code is not working fix it", "prompt": "My Python code gives an error. Please:\n1. Explain in simple words why the error happens.\n2. Show the corrected code.\n3. Tell me what to remember so I do not repeat it.\n\nCode:\nmarks = input(\"Enter marks: \")\nif marks > 35:\n    print(\"Pass\")\n\nError:\nTypeError: '>' not supported between instances of 'str' and 'int' ", "explain": "The AI cannot see your screen. Always paste **the exact code** and **the exact error message**. Asking for the reason and a lesson helps you learn instead of just copying.", "tips": ["Paste the full error, especially the last line.", "Ask WHY, not only the fixed code."], "no": 2, "id": "ai2"}, {"q": "You get an **IndentationError** after copying code.", "bad": "indentation error help", "prompt": "I get \"IndentationError: expected an indented block\" in this Python code.\nPoint out the exact line with the problem, explain what indentation means in Python,\nand give me the corrected code using 4 spaces per level.\n\nfor i in range(3):\nprint(i)", "explain": "Mentioning the exact error and asking for **4 spaces** gives you code that pastes cleanly in VS Code.", "tips": [], "no": 3, "id": "ai3"}, {"q": "You found a program online and want to **understand each line**.", "bad": "explain this", "prompt": "Explain this Python code line by line for a 12th standard student.\nFor each line write: the line, then one simple sentence of what it does.\nAt the end, tell me the output and why.\n\nnums = [4, 7, 2]\ntotal = 0\nfor n in nums:\n    total += n\nprint(total / len(nums))", "explain": "Asking for a **line by line** format and the **output with reason** turns the AI into a patient tutor.", "tips": [], "no": 4, "id": "ai4"}, {"q": "You need a program for an assignment, but you want beginner friendly code.", "bad": "write python program for simple interest", "prompt": "Write a Python program to calculate simple interest.\nRules:\n- Beginner level, no functions or libraries\n- Take principal, rate and time using input()\n- Use clear variable names and a comment on every line\n- Show a sample run with output", "explain": "Adding **rules** (level, no libraries, comments, sample run) stops the AI from giving advanced code you cannot explain in a viva.", "tips": [], "no": 5, "id": "ai5"}, {"q": "You want to **solve it yourself** but you are stuck. Ask for hints only.", "bad": "give me answer of fizzbuzz", "prompt": "I am learning Python and want to solve FizzBuzz by myself.\nDo NOT give me the full code.\nGive me 3 hints, one at a time, from small to bigger.\nWait for me to say \"next\" before giving the next hint.", "explain": "Learning happens when **you** write the code. Asking for hints step by step makes AI a coach, not a cheat sheet.", "tips": [], "no": 6, "id": "ai6"}, {"q": "You want more **practice questions** on loops.", "bad": "loop questions", "prompt": "Give me 10 practice questions on Python for and while loops for a beginner.\nArrange them from easy to hard.\nFor each question give the expected output for one sample input.\nDo not give solutions yet.", "explain": "Specify **topic, count, level, order and format**. Asking for expected outputs lets you check your own answers.", "tips": [], "no": 7, "id": "ai7"}, {"q": "You want to **trace** (dry run) a loop to see how variables change.", "bad": "what does this loop do", "prompt": "Dry run this Python code step by step.\nShow a table with columns: step, i, total, and what is printed.\n\ntotal = 0\nfor i in range(1, 5):\n    total = total + i\n    print(total)", "explain": "A **trace table** shows exactly how each variable changes. This is the best way to understand loops, and examiners love it.", "tips": [], "no": 8, "id": "ai8"}, {"q": "Your teacher wants **comments** in your project code.", "bad": "add comments", "prompt": "Add a short, simple comment above every important block of this Python code.\nDo not change the code itself. Keep comments in plain English for a viva.\n\n[paste your code here]", "explain": "Saying \"**do not change the code**\" prevents the AI from rewriting your logic. You keep your work and get clear comments.", "tips": [], "no": 9, "id": "ai9"}, {"q": "You wrote everything in one long block and want to use **functions**.", "bad": "make functions", "prompt": "Rewrite this Python program using functions.\nCreate one function for each task (input, calculate, display).\nKeep the same output. Explain why each function was created in one line.\n\n[paste your code here]", "explain": "Asking to **keep the same output** and **explain each function** helps you learn how to break a program into parts.", "tips": [], "no": 10, "id": "ai10"}, {"q": "You want to **test** your function with different inputs.", "bad": "test my code", "prompt": "Here is my Python function that checks if a number is prime.\nGive me 8 test inputs including edge cases (0, 1, 2, negative, large),\nthe expected output for each, and tell me if my function would fail any of them.\n\ndef is_prime(n):\n    for i in range(2, n):\n        if n % i == 0:\n            return False\n    return True", "explain": "AI is good at finding **edge cases** you forgot, like 0, 1 and negative numbers. Here the function wrongly says 0 and 1 are prime.", "tips": [], "no": 11, "id": "ai11"}, {"q": "Your code works but is long. Ask to **simplify** it.", "bad": "make it better", "prompt": "Make this Python code shorter and cleaner but still beginner friendly.\nShow the new code, then list each improvement in one simple line.\n\nevens = []\nfor n in [1, 2, 3, 4, 5, 6]:\n    if n % 2 == 0:\n        evens.append(n)\nprint(evens)", "explain": "\"Better\" is unclear. Saying **shorter, cleaner, beginner friendly** and asking for a list of changes gives you a useful lesson.", "tips": [], "no": 12, "id": "ai12"}, {"q": "You must plan a **college final year project**.", "bad": "give project idea", "prompt": "Suggest 3 final year project ideas for a B.Sc. IT student using Python Flask and SQLite.\nEach project must have admin login and user login.\nFor each idea give: title, 5 main features, database tables, and difficulty (easy/medium).", "explain": "Giving the **tech stack, roles and output format** makes the ideas realistic for your college requirements.", "tips": [], "no": 13, "id": "ai13"}, {"q": "You need a **database design** for a library project.", "bad": "library database", "prompt": "Design SQLite tables for a library management project in Python.\nFeatures: add books, register students, issue and return books, fine for late return.\nGive CREATE TABLE statements with primary keys and explain each table in one line.", "explain": "Listing the **features** helps the AI design the right tables. Asking for CREATE TABLE gives you code you can run directly.", "tips": [], "no": 14, "id": "ai14"}, {"q": "Your **Flask** form gives a 400 Bad Request error.", "bad": "flask error", "prompt": "My Flask login form gives \"400 Bad Request\" when I submit.\nHere is my route and my HTML form. Find the mismatch and explain it simply.\n\n@app.route(\"/login\", methods=[\"POST\"])\ndef login():\n    email = request.form[\"email\"]\n\n<form method=\"POST\" action=\"/login\">\n  <input type=\"email\" name=\"Email\">\n<\/form>", "explain": "Paste **both** the Python and the HTML. Here the bug is `name=\"Email\"` vs `request.form[\"email\"]`. The AI can only spot it if it sees both parts.", "tips": [], "no": 15, "id": "ai15"}, {"q": "You want a **Tkinter** screen and know what it should look like.", "bad": "tkinter calculator", "prompt": "Create a simple Tkinter app in Python:\n- Window title \"TICL Calculator\"\n- Two Entry boxes for numbers\n- Four buttons: +, -, x, /\n- A label that shows the result\n- Show \"Cannot divide by zero\" when needed\nUse grid layout and comment each line.", "explain": "Describe the screen like a checklist. The AI builds exactly those parts, and comments make it easy to explain.", "tips": [], "no": 16, "id": "ai16"}, {"q": "You only want to **understand an error message**, not fix code.", "bad": "what is keyerror", "prompt": "In very simple words, what does this Python error mean, when does it happen,\nand give one tiny example that causes it and one that fixes it:\n\nKeyError: 'city' ", "explain": "Small, focused questions get small, clear answers. Great for building your own debugging skill.", "tips": [], "no": 17, "id": "ai17"}, {"q": "You have a **viva** tomorrow on your project.", "bad": "viva questions", "prompt": "I made a Student Management System using Python, Flask and SQLite with login, registration and CRUD.\nAct as an external examiner. Ask me 15 viva questions from easy to hard,\nand after the list, give short model answers.", "explain": "Telling the AI your **project details** and asking it to **act as an examiner** gives realistic practice.", "tips": [], "no": 18, "id": "ai18"}, {"q": "You found two ways to solve a problem and want to **compare** them.", "bad": "which is better", "prompt": "Compare these two ways to reverse a string in Python for a beginner.\nExplain which is easier to read and which is more common, with a small table.\n\nWay 1: s[::-1]\nWay 2: using a for loop that adds each character to the front", "explain": "Comparisons help you understand **why** one way is preferred, not just how.", "tips": [], "no": 19, "id": "ai19"}, {"q": "You want the explanation in **Gujarati**.", "bad": "explain in gujarati", "prompt": "Explain Python dictionaries in simple Gujarati for a beginner student.\nKeep Python code and keywords in English.\nGive one example about a student's marks and explain the output in Gujarati.", "explain": "Ask to **keep code in English**. Python keywords must stay in English, only the explanation should be translated.", "tips": [], "no": 20, "id": "ai20"}, {"q": "You want the AI to **review** your code for bugs before submission.", "bad": "check code", "prompt": "Review this Python code like a strict teacher.\nList: 1) bugs, 2) inputs that will crash it, 3) bad variable names, 4) missing comments.\nThen give the improved code.\n\n[paste your code here]", "explain": "A **review checklist** makes the AI look at specific problems instead of giving a vague \"looks good\".", "tips": [], "no": 21, "id": "ai21"}, {"q": "You want to plan the **logic** before writing code.", "bad": "code for atm", "prompt": "Before writing code, give me the algorithm (numbered steps) and a simple flowchart in text\nfor an ATM program with: check balance, deposit, withdraw, exit.\nThen write the Python code following those exact steps.", "explain": "Steps first, code second. This is how good programmers think, and the algorithm is often asked in exams.", "tips": [], "no": 22, "id": "ai22"}, {"q": "You want to **practise** with the AI as a tutor.", "bad": "quiz me", "prompt": "Act as my Python tutor. Ask me one multiple choice question at a time on loops and lists.\nWait for my answer. Tell me if I am right, explain in one line, then ask the next question.\nKeep score out of 10.", "explain": "A **role** (\"act as my tutor\") plus **rules** (\"one at a time, wait, keep score\") turns the AI into an interactive quiz.", "tips": [], "no": 23, "id": "ai23"}, {"q": "You have **pseudocode** from your notes and want Python.", "bad": "convert this", "prompt": "Convert this pseudocode into Python. Keep the same logic and variable names.\nAdd a comment showing which pseudocode line each Python line comes from.\n\nSTART\n  SET total = 0\n  FOR each number FROM 1 TO 10\n     IF number is even THEN ADD number TO total\n  PRINT total\nEND", "explain": "Linking each Python line to the pseudocode helps you see how the steps become code.", "tips": [], "no": 24, "id": "ai24"}, {"q": "The AI gave you code. How do you make sure it is **correct**?", "bad": "is this right?", "prompt": "You gave me this code for finding the second largest number.\nExplain your logic step by step, then test it on these inputs and show the output for each:\n[5, 5, 5], [10], [3, 9, 9, 2], [-1, -5, -3].\nIf any case fails, fix the code.", "explain": "AI can make mistakes. Always ask it to **explain its logic** and **test tricky inputs**, then run the code yourself in VS Code before trusting it.", "tips": ["Never submit AI code you cannot explain.", "Run it yourself and test with your own inputs."], "no": 25, "id": "ai25"}]}]};</script>
<script>
/* TICL Academy site engine. Renders window.SITE (lessons or assignment). */
(function () {
  'use strict';
  var S = window.SITE;
  var $ = function (sel, el) { return (el || document).querySelector(sel); };
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    (kids || []).forEach(function (c) { if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function rich(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code class="ic">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------------- syntax highlighting ---------------- */
  var PYKW = {};
  'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case self'.split(' ').forEach(function (w) { PYKW[w] = 1; });
  var PYRE = /(#.*$)|([rRfFbB]{0,2}("""|'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([+\-*/%=<>!&|^~@:]+)|(\s+)|(.)/g;
  function hlPy(line) {
    var out = '', m; PYRE.lastIndex = 0;
    while ((m = PYRE.exec(line)) !== null) {
      var t = m[0]; if (!t) { PYRE.lastIndex++; continue; }
      var c = '';
      if (m[1]) c = 'com'; else if (m[2]) c = 'str'; else if (m[4]) c = 'num';
      else if (m[5]) { if (PYKW[t]) c = 'kw'; else if (/^\s*\(/.test(line.slice(PYRE.lastIndex))) c = 'fn'; }
      else if (m[6]) c = 'op';
      out += c ? '<span class="tk-' + c + '">' + esc(t) + '</span>' : esc(t);
    }
    return out;
  }
  function hlJinjaInner(s) { return '<span class="tk-jin">' + esc(s) + '</span>'; }
  function hlHtml(line) {
    var out = '', i = 0, re = /(\{\{.*?\}\}|\{%.*?%\}|\{#.*?#\})|(<!--.*?(?:-->|$))|(<\/?[A-Za-z][\w-]*)|(\/?>)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([A-Za-z_:][\w:.-]*)(?==)|(\s+|[^<{"'\s=>\/]+|.)/g, m, inTag = false;
    while ((m = re.exec(line)) !== null) {
      if (m[1]) out += hlJinjaInner(m[1]);
      else if (m[2]) out += '<span class="tk-com">' + esc(m[2]) + '</span>';
      else if (m[3]) { out += '<span class="tk-tag">' + esc(m[3]) + '</span>'; inTag = true; }
      else if (m[4]) { out += '<span class="tk-tag">' + esc(m[4]) + '</span>'; inTag = false; }
      else if (m[5]) {
        var sv = m[5];
        out += '<span class="tk-str">' + esc(sv).replace(/(\{\{.*?\}\}|\{%.*?%\})/g, '</span><span class="tk-jin">$1</span><span class="tk-str">') + '</span>';
      }
      else if (m[6] && inTag) out += '<span class="tk-attr">' + esc(m[6]) + '</span>';
      else out += esc(m[0]);
    }
    return out;
  }
  function hlCss(line) {
    if (/^\s*\/\*/.test(line)) return '<span class="tk-com">' + esc(line) + '</span>';
    var m = line.match(/^(\s*)([\w-]+)(\s*:\s*)([^;]*)(;?.*)$/);
    if (m && !/[{}]/.test(line)) return esc(m[1]) + '<span class="tk-prop">' + esc(m[2]) + '</span>' + esc(m[3]) + '<span class="tk-num">' + esc(m[4]) + '</span>' + esc(m[5]);
    if (/\{/.test(line)) { var p = line.split('{'); return '<span class="tk-sel">' + esc(p[0]) + '</span>{' + esc(p.slice(1).join('{')); }
    return esc(line);
  }
  function hlBash(line) {
    if (/^\s*#/.test(line)) return '<span class="tk-com">' + esc(line) + '</span>';
    return esc(line).replace(/^(\s*)([\w.\-\\\/]+)/, '$1<span class="tk-fn">$2</span>');
  }
  function highlight(lang, line) {
    if (!line.trim()) return ' ';
    if (lang === 'html') return hlHtml(line);
    if (lang === 'css') return hlCss(line);
    if (lang === 'bash') return hlBash(line);
    if (lang === 'text') return esc(line);
    return hlPy(line);
  }

  /* ---------------- copy ---------------- */
  function copyText(text) {
    return new Promise(function (res) {
      function fallback() {
        try {
          var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
          ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
          document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy'); document.body.removeChild(ta); res(ok);
        } catch (e) { res(false); }
      }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { res(true); }, fallback);
      else fallback();
    });
  }
  function copyChip(getText, label) {
    label = label || 'Copy code';
    var b = h('button', { class: 'chip copy', type: 'button', title: 'Copy with correct indentation', text: label });
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      copyText(getText()).then(function (ok) {
        b.textContent = ok ? '\u2713 Copied' : 'Copy failed'; b.classList.toggle('ok', ok);
        setTimeout(function () { b.textContent = label; b.classList.remove('ok'); }, 2000);
      });
    });
    return b;
  }

  /* ---------------- code block ---------------- */
  function codeBlock(cb) {
    var lang = cb.lang || 'py';
    var lines = cb.lines;
    var all = false, wrap = true;
    var root = h('div', { class: 'cb' });
    var plain = function () { return lines.map(function (l) { return l.c.replace(/\t/g, '    ').replace(/\u00A0/g, ' '); }).join('\n') + '\n'; };
    var hint = h('div', { class: 'cbhint', text: 'Hover or tap any line to see what it does' });
    var explainBtn = h('button', { class: 'chip', type: 'button', text: 'Explain all' });
    var wrapBtn = h('button', { class: 'chip', type: 'button', text: '\u2194 Scroll' });
    var names = { py: 'example.py', html: 'page.html', css: 'style.css', bash: 'terminal', text: 'text' };
    root.appendChild(h('div', { class: 'cbh' }, [
      h('span', { class: 'dots' }, [h('i', { style: 'background:#F87171' }), h('i', { style: 'background:#F59E0B' }), h('i', { style: 'background:#10B981' })]),
      h('span', { class: 'cbt', text: cb.title || names[lang] || 'code' }),
      copyChip(plain), wrapBtn, explainBtn
    ]));
    root.appendChild(hint);
    var body = h('div', { class: 'lines' });
    root.appendChild(body);
    var rows = [];
    lines.forEach(function (l, i) {
      var blank = !l.c.trim() || !l.t;
      var row = h('div', { class: 'ln' + (blank ? ' blank' : '') });
      row.appendChild(h('span', { class: 'no', text: String(i + 1) }));
      row.appendChild(h('span', { class: 'cd', html: highlight(lang, l.c) }));
      if (!blank) {
        row.appendChild(h('span', { class: 'q', text: '?' }));
        row.appendChild(h('div', { class: 'hov', html: rich(l.t) }));
      }
      var tip = h('div', { class: 'tip', html: '<div class="tl">LINE ' + (i + 1) + '</div><div class="tt">' + rich(l.t || '') + '</div>' });
      tip.style.display = 'none';
      if (!blank) row.addEventListener('click', function () { var on = tip.style.display === 'none'; tip.style.display = on ? 'block' : 'none'; row.classList.toggle('on', on); });
      body.appendChild(row); body.appendChild(tip);
      rows.push({ row: row, tip: tip, blank: blank });
    });
    explainBtn.addEventListener('click', function () {
      all = !all; explainBtn.textContent = all ? 'Hide all' : 'Explain all';
      rows.forEach(function (r) { if (r.blank) return; r.tip.style.display = all ? 'block' : 'none'; r.row.classList.toggle('on', all); });
    });
    wrapBtn.addEventListener('click', function () {
      wrap = !wrap; root.classList.toggle('scroll', !wrap); wrapBtn.textContent = wrap ? '\u2194 Scroll' : '\u21B5 Wrap';
    });
    if (cb.out != null) root.appendChild(h('div', { class: 'out' }, [h('div', { class: 'ol', text: cb.outLabel || 'OUTPUT' }), h('pre', { text: cb.out })]));
    return root;
  }

  /* ---------------- sections ---------------- */
  function section(s) {
    switch (s[0]) {
      case 'h': return h('h2', { class: 'h', html: rich(s[1]) });
      case 'p': return h('p', { class: 'p', html: rich(s[1]) });
      case 'list': return h('ol', { class: 'ul' }, s[1].map(function (x) { return h('li', { html: rich(x) }); }));
      case 'note': return h('div', { class: 'note' }, [h('div', { class: 'nh', text: s[2] || "KEVIN SIR'S TIP" }), h('div', { html: rich(s[1]) })]);
      case 'table': return h('div', { class: 'tblw' }, [h('table', { class: 'tb' }, s[1].map(function (r, i) {
        return h('tr', null, r.map(function (c) { return h(i ? 'td' : 'th', { html: rich(c) }); }));
      }))]);
      case 'flow':
        var f = h('div', { class: 'flow' });
        s[1].forEach(function (st, i) {
          if (i) f.appendChild(h('span', { class: 'ar', text: '\u2192' }));
          f.appendChild(h('div', { class: 'st' }, [h('div', { class: 'k', text: st[0] }), h('div', { class: 'v', html: rich(st[1]) })]));
        });
        return f;
      case 'img': return h('div', { class: 'shot' }, [h('img', { src: s[1], alt: s[2] || '', loading: 'lazy' }), s[2] ? h('div', { text: s[2] }) : null]);
      case 'code': return codeBlock(s[1]);
      case 'preview':
        var pv = h('div', { class: 'cb' }, [h('div', { class: 'cbh' }, [h('span', { class: 'dots' }, [h('i', { style: 'background:#F87171' }), h('i', { style: 'background:#F59E0B' }), h('i', { style: 'background:#10B981' })]), h('span', { class: 'cbt', text: s[2] || 'LIVE PREVIEW: how the browser shows it' })])]);
        var fr = h('iframe', { title: 'preview', sandbox: '', style: 'width:100%;height:' + (s[3] || 180) + 'px;border:0;background:#fff;display:block' });
        fr.srcdoc = s[1]; pv.appendChild(fr); return pv;
      default: return null;
    }
  }

  function quiz(items) {
    if (!items || !items.length) return null;
    var q = h('div', { class: 'quiz' }, [h('h3', { text: 'Quick Quiz' }), h('div', { style: 'color:var(--muted);font-size:13px', text: 'Click an answer to check yourself' })]);
    items.forEach(function (it, n) {
      var box = h('div', { class: 'qq' }, [h('div', { html: '<b>Q' + (n + 1) + '.</b> ' + rich(it.q) })]);
      var fb = h('div'); var btns = [];
      it.options.forEach(function (o, i) {
        var b = h('button', { class: 'opt', type: 'button', html: '<b>' + String.fromCharCode(65 + i) + '</b><span>' + rich(o) + '</span>' });
        b.addEventListener('click', function () {
          btns.forEach(function (x, j) { x.disabled = true; if (j === it.answer) x.classList.add('r'); });
          if (i !== it.answer) b.classList.add('w');
          var ok = i === it.answer;
          fb.className = 'fb ' + (ok ? 'ok' : 'no');
          fb.innerHTML = '<b style="color:' + (ok ? 'var(--green)' : 'var(--red)') + '">' + (ok ? 'Correct! Well done.' : 'Not quite. Answer: ' + String.fromCharCode(65 + it.answer)) + '</b>' + (it.why ? '<div>' + rich(it.why) + '</div>' : '') + '<a href="#" style="font-size:13px">Try again</a>';
          fb.querySelector('a').addEventListener('click', function (e) { e.preventDefault(); btns.forEach(function (x) { x.disabled = false; x.classList.remove('r', 'w'); }); fb.innerHTML = ''; fb.className = ''; });
        });
        btns.push(b); box.appendChild(b);
      });
      box.appendChild(fb); q.appendChild(box);
    });
    return q;
  }

  /* ---------------- chrome ---------------- */
  function header(tabs, active, onTab) {
    var top = h('header', { class: 'top' });
    top.appendChild(h('div', { class: 'topin' }, [
      h('img', { class: 'logo', src: S.logo, alt: 'TICL Academy' }),
      h('div', { class: 'brand' }, [h('small', { text: 'TICL ACADEMY' }), h('b', { text: S.title })]),
      h('button', { class: 'iconbtn', type: 'button', title: 'About', text: 'i', onclick: about })
    ]));
    var tb = h('nav', { class: 'tabs' });
    tabs.forEach(function (t, i) {
      tb.appendChild(h('button', { class: 'tab' + (i === active ? ' on' : ''), type: 'button', text: t, onclick: function () { onTab(i); } }));
    });
    top.appendChild(tb);
    return top;
  }
  function modal(content) {
    var m = h('div', { class: 'modal', onclick: function (e) { if (e.target === m) close(); } });
    function close() { m.remove(); }
    var card = h('div', { class: 'mcard' }, content(close));
    m.appendChild(card);
    document.body.appendChild(m);
    return m;
  }
  function welcome() {
    modal(function (close) {
      return [h('img', { src: S.logo, alt: '' }), h('h2', { text: 'Welcome \uD83D\uDE4F' }), h('p', { text: S.welcome }),
        h('div', { style: 'color:var(--muted);font-size:13px', text: 'TICL Academy' }),
        h('button', { class: 'btn', type: 'button', text: "Let's start", onclick: close })];
    });
  }
  function about() {
    modal(function (close) {
      var dl = h('dl');
      S.about.forEach(function (r) { dl.appendChild(h('dt', { text: r[0] })); dl.appendChild(h('dd', { text: r[1] })); });
      return [h('img', { src: S.logo, alt: '' }), h('h2', { style: 'font-size:24px', text: S.title }), h('div', { class: 'about' }, [dl]),
        h('button', { class: 'btn', type: 'button', text: 'Close', onclick: close })];
    });
  }
  var toTop = h('button', { class: 'totop', type: 'button', title: 'Back to top', text: '\u2191', onclick: function () { window.scrollTo({ top: 0, behavior: 'smooth' }); } });
  window.addEventListener('scroll', function () { toTop.classList.toggle('show', window.scrollY > 600); });

  /* ================= LESSONS SITE ================= */
  function lessonsApp() {
    var KEY = S.storeKey;
    var done = store.get(KEY, {});
    var st = { tab: 0, idx: 0, sideOpen: false };
    var m = /^#(\d+)\/(\d+)/.exec(location.hash);
    if (m && S.tabs[+m[1]] && S.tabs[+m[1]].lessons[+m[2]]) { st.tab = +m[1]; st.idx = +m[2]; }
    var app = document.getElementById('app');

    function go(tab, idx) {
      st.tab = tab; st.idx = idx; st.sideOpen = false;
      try { history.replaceState(null, '', '#' + tab + '/' + idx); } catch (e) {}
      render(); window.scrollTo(0, 0);
    }
    function render() {
      app.innerHTML = '';
      var T = S.tabs[st.tab], L = T.lessons[st.idx];
      app.appendChild(header(S.tabs.map(function (t) { return t.label; }), st.tab, function (i) { go(i, 0); }));
      var side = h('aside', { class: 'side' + (st.sideOpen ? ' open' : '') });
      side.appendChild(h('h4', { text: T.label.toUpperCase() }));
      T.lessons.forEach(function (l, i) {
        var key = T.id + ':' + l.id;
        side.appendChild(h('button', { class: 'litem' + (i === st.idx ? ' on' : '') + (done[key] ? ' done' : ''), type: 'button', onclick: function () { go(st.tab, i); } },
          [h('span', { class: 'n', text: done[key] ? '\u2713' : String(i + 1) }), h('span', { class: 't', text: l.title })]));
      });
      var main = h('main', { class: 'main' });
      main.appendChild(h('div', { class: 'mobnav' }, [
        h('button', { class: 'btn gold', type: 'button', text: (st.sideOpen ? '\u2715 Close' : '\u2630 Lessons') + ' (' + T.lessons.length + ')', onclick: function () { st.sideOpen = !st.sideOpen; render(); } })
      ]));
      if (st.idx === 0) {
        var total = 0, cnt = 0;
        S.tabs.forEach(function (t) { t.lessons.forEach(function (l) { total++; if (done[t.id + ':' + l.id]) cnt++; }); });
        main.appendChild(h('div', { class: 'hero' }, [
          h('span', { class: 'pill', text: T.pill || 'FREE  \u00B7  TICL ACADEMY' }),
          h('h1', { html: T.heroTitle || esc(T.label) }),
          h('div', { class: 's', text: S.subtitle }),
          h('p', { html: rich(T.desc || '') }),
          h('div', { style: 'display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted)' }, [h('span', { text: 'Your progress (all tabs)' }), h('b', { text: cnt + '/' + total + ' lessons' })]),
          h('div', { class: 'bar' }, [h('i', { style: 'width:' + Math.round(cnt / total * 100) + '%' })])
        ]));
      }
      main.appendChild(h('div', { class: 'crumb', text: T.label.toUpperCase() + '  \u00B7  LESSON ' + (st.idx + 1) + ' OF ' + T.lessons.length }));
      main.appendChild(h('h1', { class: 'lt', text: L.title }));
      main.appendChild(h('p', { class: 'sum', text: L.summary }));
      main.appendChild(h('div', { class: 'div' }));
      L.sections.forEach(function (s) { var el = section(s); if (el) main.appendChild(el); });
      var q = quiz(L.quiz); if (q) main.appendChild(q);
      var key = T.id + ':' + L.id;
      main.appendChild(h('button', { class: 'btn ghost' + (done[key] ? ' on' : ''), type: 'button', style: 'width:100%;justify-content:center;margin-top:20px',
        text: done[key] ? '\u2713 Lesson completed' : 'Mark lesson as completed',
        onclick: function () { done[key] = !done[key]; store.set(KEY, done); render(); } }));
      var nav = h('div', { class: 'navrow' });
      var prev = st.idx > 0 ? [st.tab, st.idx - 1] : st.tab > 0 ? [st.tab - 1, S.tabs[st.tab - 1].lessons.length - 1] : null;
      var next = st.idx < T.lessons.length - 1 ? [st.tab, st.idx + 1] : st.tab < S.tabs.length - 1 ? [st.tab + 1, 0] : null;
      nav.appendChild(prev ? h('button', { class: 'btn', type: 'button', onclick: function () { go(prev[0], prev[1]); } }, [h('small', { text: '\u2039 Previous' }), h('span', { text: S.tabs[prev[0]].lessons[prev[1]].title })]) : h('span', { style: 'flex:1' }));
      nav.appendChild(next ? h('button', { class: 'btn nx', type: 'button', onclick: function () { done[key] = true; store.set(KEY, done); go(next[0], next[1]); } }, [h('small', { text: 'Next \u203A' }), h('span', { text: S.tabs[next[0]].lessons[next[1]].title })]) : h('span', { style: 'flex:1' }));
      main.appendChild(nav);
      main.appendChild(h('div', { class: 'foot', text: S.footer }));
      app.appendChild(h('div', { class: 'wrap' }, [side, main]));
      app.appendChild(toTop);
    }
    render();
  }

  /* ================= ASSIGNMENT SITE ================= */
  function assignmentApp() {
    var KEY = S.storeKey;
    var done = store.get(KEY, {});
    var st = { tab: 0, sub: 0, topic: 'All', q: '', open: {}, hint: {} };
    var app = document.getElementById('app');
    var SUBS = S.groups; // [{id,label,items,kind}]

    function topicsOf(g) { var t = ['All']; g.items.forEach(function (x) { if (x.topic && t.indexOf(x.topic) < 0) t.push(x.topic); }); return t; }
    function matches(x) {
      if (st.topic !== 'All' && x.topic !== st.topic) return false;
      if (!st.q) return true;
      var s = (x.q + ' ' + (x.topic || '') + ' #' + x.no).toLowerCase();
      return s.indexOf(st.q.toLowerCase()) >= 0;
    }
    function gotoSolution(gIdx, id) {
      st.tab = 1; st.sub = gIdx; st.topic = 'All'; st.q = ''; st.open[id] = true; render();
      setTimeout(function () { var el = document.getElementById('sol-' + id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); } }, 60);
    }
    function gotoQuestion(gIdx, id) {
      st.tab = 0; st.sub = gIdx; st.topic = 'All'; st.q = ''; render();
      setTimeout(function () { var el = document.getElementById('q-' + id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); } }, 60);
    }

    function qCard(g, gi, x) {
      var isDone = !!done[x.id];
      var card = h('div', { class: 'qcard' + (isDone ? ' done' : ''), id: 'q-' + x.id });
      card.appendChild(h('div', { class: 'qhead' }, [
        h('span', { class: 'qn', text: (isDone ? '\u2713 ' : '') + 'Q' + x.no }),
        x.topic ? h('span', { class: 'tag', text: x.topic }) : null,
        x.level ? h('span', { class: 'tag lvl-' + x.level, text: x.level }) : null
      ]));
      card.appendChild(h('div', { class: 'qtext', html: rich(x.q) }));
      var hintBox = x.hint ? h('div', { class: 'hint', html: '<b style="color:var(--gold)">Hint: </b>' + rich(x.hint) }) : null;
      if (hintBox && !st.hint[x.id]) hintBox.style.display = 'none';
      var act = h('div', { class: 'qact' });
      if (hintBox) act.appendChild(h('button', { class: 'mini', type: 'button', text: '\uD83D\uDCA1 Hint', onclick: function () { st.hint[x.id] = !st.hint[x.id]; hintBox.style.display = st.hint[x.id] ? 'block' : 'none'; } }));
      act.appendChild(h('button', { class: 'mini' + (isDone ? ' on' : ''), type: 'button', text: isDone ? '\u2713 Done' : 'Mark as done', onclick: function () { done[x.id] = !done[x.id]; store.set(KEY, done); render(true); } }));
      act.appendChild(h('button', { class: 'mini', type: 'button', text: 'See solution \u203A', onclick: function () { gotoSolution(gi, x.id); } }));
      card.appendChild(act);
      if (hintBox) card.appendChild(hintBox);
      return card;
    }
    function solBody(g, gi, x) {
      var b = h('div', { class: 'solb' });
      if (g.kind === 'python') {
        b.appendChild(h('div', { class: 'kid' }, [h('div', { class: 'kh', text: "KEVIN SIR EXPLAINS (SIMPLE)" }), h('div', { html: rich(x.explain) })]));
        b.appendChild(codeBlock({ lang: 'py', title: 'q' + x.no + '.py', lines: x.lines, out: x.out, outLabel: x.outLabel }));
        if (x.extra) b.appendChild(h('div', { class: 'note' }, [h('div', { class: 'nh', text: 'REMEMBER' }), h('div', { html: rich(x.extra) })]));
      } else if (g.kind === 'html') {
        b.appendChild(h('div', { class: 'kid' }, [h('div', { class: 'kh', text: 'DEFINITION (SIMPLE)' }), h('div', { html: rich(x.answer) })]));
        if (x.lines) {
          b.appendChild(codeBlock({ lang: x.lang || 'html', title: x.lang === 'css' ? 'style.css' : 'page.html', lines: x.lines }));
          if (x.preview) {
            var pv = h('div', { class: 'cb' }, [h('div', { class: 'cbh' }, [h('span', { class: 'cbt', text: 'LIVE PREVIEW: this is how the browser shows it' })])]);
            var fr = h('iframe', { title: 'preview', sandbox: '', style: 'width:100%;height:' + (x.previewH || 150) + 'px;border:0;background:#fff;display:block' });
            fr.srcdoc = x.preview; pv.appendChild(fr); b.appendChild(pv);
          }
        }
        if (x.explain) b.appendChild(h('p', { class: 'p', html: rich(x.explain) }));
      } else if (g.kind === 'ai') {
        b.appendChild(h('div', { class: 'kid' }, [h('div', { class: 'kh', text: 'WHY THIS WORKS' }), h('div', { html: rich(x.explain) })]));
        b.appendChild(h('div', { class: 'bad', html: '<b style="color:var(--red)">Weak prompt: </b>' + rich(x.bad) }));
        var pr = h('div', { class: 'prompt', text: x.prompt });
        pr.appendChild(copyChip(function () { return x.prompt; }, 'Copy prompt'));
        b.appendChild(h('div', { style: 'color:var(--green);font-size:11px;font-weight:800;letter-spacing:1px;margin:10px 0 4px', text: 'STRONG PROMPT (COPY AND USE)' }));
        b.appendChild(pr);
        if (x.tips) b.appendChild(h('ol', { class: 'ul' }, x.tips.map(function (t) { return h('li', { html: rich(t) }); })));
      }
      b.appendChild(h('button', { class: 'mini', type: 'button', style: 'margin-top:10px', text: '\u2039 Back to question', onclick: function () { gotoQuestion(gi, x.id); } }));
      return b;
    }
    function solCard(g, gi, x) {
      var open = !!st.open[x.id];
      var card = h('div', { class: 'sol' + (open ? ' open' : ''), id: 'sol-' + x.id });
      var head = h('button', { class: 'solh', type: 'button' }, [
        h('span', { class: 'qn', text: 'Q' + x.no }),
        h('span', { class: 'qtext', html: rich(x.q) }),
        h('span', { class: 'chev', text: '\u203A' })
      ]);
      var body = null;
      head.addEventListener('click', function () {
        st.open[x.id] = !st.open[x.id];
        card.classList.toggle('open', st.open[x.id]);
        if (st.open[x.id]) { body = solBody(g, gi, x); card.appendChild(body); } else if (body) { body.remove(); body = null; }
      });
      card.appendChild(head);
      if (open) { body = solBody(g, gi, x); card.appendChild(body); }
      return card;
    }

    var listEl = null;
    function renderList() {
      var g = SUBS[st.sub];
      listEl.innerHTML = '';
      var items = g.items.filter(matches);
      if (!items.length) listEl.appendChild(h('div', { class: 'empty', text: 'Nothing found. Try another word.' }));
      items.forEach(function (x) { listEl.appendChild(st.tab === 0 ? qCard(g, st.sub, x) : solCard(g, st.sub, x)); });
    }
    function render(keepScroll) {
      var y = window.scrollY;
      app.innerHTML = '';
      app.appendChild(header(S.tabLabels, st.tab, function (i) { st.tab = i; st.topic = 'All'; st.q = ''; render(); window.scrollTo(0, 0); }));
      var main = h('main', { class: 'main' });
      var total = 0, cnt = 0;
      SUBS.forEach(function (g) { g.items.forEach(function (x) { total++; if (done[x.id]) cnt++; }); });
      main.appendChild(h('div', { class: 'hero' }, [
        h('span', { class: 'pill', text: st.tab === 0 ? 'PRACTICE  \u00B7  ' + total + ' QUESTIONS' : 'SOLUTIONS  \u00B7  EXPLAINED SIMPLY' }),
        h('h1', { html: st.tab === 0 ? 'Python <span>Assignment</span>' : 'Solutions <span>explained</span>' }),
        h('div', { class: 's', text: S.subtitle }),
        h('p', { html: rich(st.tab === 0 ? S.qIntro : S.sIntro) }),
        h('div', { style: 'display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted)' }, [h('span', { text: 'Questions done' }), h('b', { text: cnt + '/' + total })]),
        h('div', { class: 'bar' }, [h('i', { style: 'width:' + Math.round(cnt / total * 100) + '%' })])
      ]));
      var subs = h('div', { class: 'subtabs' });
      SUBS.forEach(function (g, i) {
        subs.appendChild(h('button', { class: 'subtab' + (i === st.sub ? ' on' : ''), type: 'button', text: g.label + ' (' + g.items.length + ')', onclick: function () { st.sub = i; st.topic = 'All'; st.q = ''; render(); } }));
      });
      main.appendChild(subs);
      var g = SUBS[st.sub];
      var search = h('input', { class: 'search', type: 'search', placeholder: 'Search, e.g. loop, list, login, #25', value: st.q });
      search.addEventListener('input', function () { st.q = search.value; renderList(); });
      var bar = h('div', { class: 'toolbar' }, [search]);
      if (st.tab === 1) {
        bar.appendChild(h('button', { class: 'mini', type: 'button', text: 'Open all', onclick: function () { g.items.filter(matches).forEach(function (x) { st.open[x.id] = true; }); renderList(); } }));
        bar.appendChild(h('button', { class: 'mini', type: 'button', text: 'Close all', onclick: function () { st.open = {}; renderList(); } }));
      }
      main.appendChild(bar);
      var tps = topicsOf(g);
      if (tps.length > 2) {
        var fc = h('div', { class: 'fchips' });
        tps.forEach(function (t) {
          var n = t === 'All' ? g.items.length : g.items.filter(function (x) { return x.topic === t; }).length;
          fc.appendChild(h('button', { class: 'fchip' + (st.topic === t ? ' on' : ''), type: 'button', html: esc(t) + '<em>' + n + '</em>', onclick: function () { st.topic = t; render(); } }));
        });
        main.appendChild(fc);
      }
      listEl = h('div');
      main.appendChild(listEl);
      renderList();
      main.appendChild(h('div', { class: 'foot', text: S.footer }));
      var wrap = h('div', { class: 'wrap', style: 'grid-template-columns:minmax(0,1fr);max-width:1000px' }, [main]);
      app.appendChild(wrap);
      app.appendChild(toTop);
      if (keepScroll) window.scrollTo(0, y);
    }
    render();
  }

  document.title = S.title;
  if (S.kind === 'assignment') assignmentApp(); else lessonsApp();
  welcome();
})();

</script>
</body>
</html>
